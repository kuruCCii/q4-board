<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒介投放项目总看板 · Q4</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e4e8ef; --line2:#eef1f6;
  --tx:#1f2329; --tx2:#646a73; --tx3:#8f959e;
  --blue:#2f5cad; --blue-bg:#eaf1fb;
  --green:#2e7d32; --green-bg:#e6f2e8;
  --amber:#9a6700; --amber-bg:#fdf3d8;
  --yellow-bg:#fff3b8; --yellow-tx:#7a5b00;
  --red:#b3261e; --red-bg:#fbeae9;
  --purple:#6b4fbb; --purple-bg:#efeafa;
  --dy:#161823; --xhs:#e0303f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#f4f6f9;color-scheme:light}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}

/* 口令门 */
th.s{cursor:pointer;user-select:none;white-space:nowrap}
th.s:hover{color:var(--tx)}
th.s .car{display:inline-block;margin-left:3px;font-size:9px;opacity:.3;transform:translateY(-1px)}
th.s.on .car{opacity:1;color:var(--blue)}
th.s.on{color:var(--blue)}
.uvgap{margin:2px 0 10px;padding:8px 12px;border-radius:8px;background:#fff8e6;border:1px solid #f4e0a8;color:#8a5a00;font-size:12px;line-height:1.65}
.uvgap b{color:#7a4e00}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:36px 40px;width:360px;text-align:center}
#gate h1{font-size:17px;font-weight:600;margin-bottom:6px}
#gate p{color:var(--tx2);font-size:13px;margin-bottom:18px}
#gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;text-align:center;letter-spacing:2px}
#gate input:focus{border-color:var(--blue)}
#gate button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;cursor:pointer}
#gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
header.top h1{font-size:20px;font-weight:600}
header.top .sub{color:var(--tx3);font-size:13px}
.updated{color:var(--tx3);font-size:12px;margin-bottom:18px}
.crumb{margin-bottom:14px;font-size:13px}
.crumb a{cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .k{color:var(--tx2);font-size:12px;margin-bottom:4px}
.stat .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--tx3);font-weight:400}
.stat .s{font-size:12px;color:var(--tx3);margin-top:2px}

/* 实时数据卡片 */
.rt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.rt-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rt-head .t{font-size:14px;font-weight:600}
.rt-head .t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#d94b3d;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 3px rgba(217,75,61,.15)}
.rt-head .s{font-size:11px;color:var(--tx3)}
.rt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rt-cell{background:#fafbfd;border:1px solid var(--line2);border-radius:9px;padding:11px 13px}
.rt-cell .k{font-size:12px;color:var(--tx2)}
.rt-cell .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blue);margin-top:1px}
.rt-cell .v.zero{color:var(--tx3)}
.rt-cell .s{font-size:11px;color:var(--tx3);margin-top:1px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .head h3{font-size:16px;font-weight:600}
.card .head .go{color:var(--tx3);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--blue-bg);color:var(--blue)}
.chip.st{background:var(--green-bg);color:var(--green)}
.chip.cat{background:var(--purple-bg);color:var(--purple)}
.meta{color:var(--tx3);font-size:12px;margin-bottom:12px}
.meter{margin:9px 0 0}
.meter .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.meter .row .lab{color:var(--tx2)}
.meter .row .num{font-variant-numeric:tabular-nums;color:var(--tx)}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.bar>i.ok{background:var(--green)}
.bar>i.warn{background:#d9a514}
.bar>i.low{background:#d85a30}

.dhead h1{font-size:20px;font-weight:600;display:inline}
.dmeta{color:var(--tx2);font-size:13px;margin:8px 0 16px}
.dmeta span{margin-right:16px}
.dmeta .dnote{display:block;margin:6px 0 0;font-size:11px;color:var(--tx3);line-height:1.7}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
section>h2{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--tx)}
section>h2 .hint{font-size:12px;font-weight:400;color:var(--tx3);margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--tx2);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td.cat{color:var(--tx2)}
td.metric{color:var(--tx);font-weight:500}
.pbar{width:100px;height:7px;background:var(--line2);border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar>i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.pbar>i.ok{background:var(--green)}
.pbar>i.warn{background:#d9a514}
.pbar>i.low{background:#d85a30}
.pbar.full{width:100%;display:block;height:8px}
td .pv{margin-left:8px;font-size:12px;color:var(--tx2)}
td.note{color:var(--tx3);font-size:12px;max-width:260px}
.plat-row td{background:#fafbfc;font-weight:600}

.kpi-hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.hero{border:1px solid var(--line2);border-radius:10px;padding:16px 18px;background:var(--card)}
.hero .k{font-size:12px;color:var(--tx2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.hero .k .go{color:var(--blue);font-size:11px}
.hero .v{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.hero .t{font-size:12px;color:var(--tx3);margin-top:2px}
.hero .bwrap{margin-top:10px;display:flex;align-items:center;gap:8px}
.hero .bwrap .pbar.full{flex:1 1 auto;width:auto}
.hero .bwrap .pct{font-size:12px;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums}
.hero.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.hero.click:hover{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}

.metric-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.metric-cell{border:1px solid var(--line2);border-radius:10px;padding:14px 16px}
.metric-cell .k{font-size:12px;color:var(--tx2);margin-bottom:4px}
.metric-cell .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.metric-cell .t{font-size:11px;color:var(--tx3);margin-top:2px}
.textblock{white-space:pre-wrap;font-size:13px;color:var(--tx);line-height:1.8}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.two-col section{margin-bottom:0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{border:1px solid var(--line2);border-radius:10px;padding:14px 14px 8px}
.chart .ct{font-size:13px;font-weight:500;margin-bottom:2px}
.chart .cs{font-size:11px;color:var(--tx3);margin-bottom:8px}
.chart svg{display:block;width:100%;height:150px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--tx3);font-size:12px;text-align:center;line-height:1.9}
.toplink{margin-left:auto;font-size:12px;color:var(--blue);cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;white-space:nowrap}
.toplink:hover{background:var(--blue-bg);border-color:#c8d9f3}
.gdesc{font-size:12px;color:var(--tx2);line-height:1.75;margin:2px 0 10px}
.gdoc{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px;overflow:hidden}
.gdoc .gdt{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fafbfd;border-bottom:1px solid var(--line2)}
.gdoc .gdt a{font-size:13px;font-weight:600;color:var(--blue);text-decoration:none}
.gdoc .gdt a:hover{text-decoration:underline}
.gdoc .gdc{font-size:11px;color:var(--tx3);margin-left:auto;white-space:nowrap}
.gdoc .gdt2{font-size:13px;font-weight:600;color:var(--amber)}
table.gt{width:100%;border-collapse:collapse;font-size:12px}
table.gt th{text-align:left;font-weight:500;color:var(--tx3);background:#fcfcfe;border-bottom:1px solid var(--line2);padding:7px 12px;font-size:11px;white-space:nowrap}
table.gt td{padding:8px 12px;border-bottom:1px solid var(--line2);color:var(--tx);vertical-align:top;line-height:1.6}
table.gt tr:last-child td{border-bottom:none}
table.gt .gs{width:26%;min-width:190px}
table.gt .sname{display:block;font-weight:500}
table.gt .sid{display:inline-block;margin-top:2px;font-size:10px;color:var(--tx3);background:#f2f4f7;border-radius:4px;padding:0 5px;letter-spacing:.3px}
table.gt .gf{color:var(--tx2);width:32%}
table.gt .gfr{color:var(--tx3);white-space:nowrap;width:90px}
.glocal{border-color:#f1dfae;background:#fffdf6}
.glocal .gdt{background:#fff8e6;border-bottom-color:#f4e6c0}
.gdel{color:var(--red);cursor:pointer;font-size:12px}
.gapbox{margin:6px 0 18px;padding:10px 14px;border-radius:10px;background:var(--amber-bg);border:1px solid #f0e0b0;font-size:12px;color:#6b4e00;line-height:1.75}
.gapbox b{display:block;margin-bottom:2px;color:#5a4200}
.gapbox ul{margin:0;padding-left:16px}
.gform{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.gform label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--tx3);width:calc(33.333% - 7px);min-width:200px}
.gform label.wide{width:100%}
.gform input,.gform select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;color:var(--tx);background:#fff;outline:none}
.gform input:focus,.gform select:focus{border-color:var(--blue)}
.gbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer}
.btn:hover{background:#f7f9fc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.foot{margin-top:26px;color:var(--tx3);font-size:12px;text-align:center;line-height:1.9}
/* 投流诊断筛选器 */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.fbar .fg{font-size:12px;color:var(--tx3);margin:0 2px 0 10px}
.fbar .fg:first-child{margin-left:0}
.fchip{font-size:12px;padding:4px 11px;border-radius:20px;background:#f2f4f7;color:var(--tx2);cursor:pointer;border:1px solid transparent;transition:all .12s;user-select:none}
.fchip:hover{background:#e9edf4}
.fchip.on{background:var(--blue-bg);color:var(--blue);border-color:#c3d6f2;font-weight:500}
.adsul{padding-left:18px;font-size:13px;line-height:2}

/* 发布内容入口 */
.entry{display:flex;gap:12px}
.entry .e{flex:1 1 0;min-width:0;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.entry .e:hover{border-color:var(--blue);background:#fbfcfe}
.entry .e .l{display:flex;align-items:center;gap:10px;min-width:0}
.entry .e .l>div{min-width:0}
.plat-dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.plat-dot.dy{background:var(--dy)}
.plat-dot.xhs{background:var(--xhs)}
.entry .e .nm{font-size:14px;font-weight:500}
.entry .e .ct{font-size:12px;color:var(--tx3)}
.entry .e .arw{color:var(--tx3);font-size:13px}

/* 内容子页面 */
.psection{margin-bottom:26px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.phead .nm{font-size:17px;font-weight:600}
.phead .ct{font-size:12px;color:var(--tx3)}
.phead .tagb{font-size:11px;padding:2px 8px;border-radius:20px;background:#f2f4f7;color:var(--tx2);margin-left:auto}
.typeg{margin-bottom:18px}
.typeg>h4{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.typeg>h4 .n{font-weight:400;color:var(--tx3);font-size:11px;background:#f2f4f7;border-radius:20px;padding:1px 7px}
.typeg>h4::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue);display:inline-block}
.typeg>h4 .tm{margin-left:auto;display:flex;gap:14px;font-weight:400;font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums}
.typeg>h4 .tm .tmi{white-space:nowrap}
.typeg>h4 .tm b{font-weight:500;color:var(--tx3);margin-right:5px;font-size:11px}
.ccards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);transition:border-color .15s}
.ccard:hover{border-color:#cfd6e2}
.ccard.old{background:#fcfcfd;border-style:dashed}
.cwrap{width:88px;flex:none;display:flex}
.ccover{width:88px;flex:1;min-height:112px;border-radius:8px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:8px;color:#fff}
.ccover .pb{font-size:10px;opacity:.85}
.ccover .nn{font-size:12px;font-weight:600;line-height:1.35;word-break:break-all}
.ccover .dd{font-size:10px;opacity:.8}
.ccover.dy{background:linear-gradient(150deg,#2b2f3d,#161823)}
.ccover.xhs{background:linear-gradient(150deg,#f0605f,#c81f33)}
.ccover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ccover .ov{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;height:100%;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column}
.cname{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cname .ti{font-size:10px;font-weight:400;color:var(--tx3);border:1px solid var(--line);border-radius:20px;padding:0 6px}
.cname .old{font-size:10px;font-weight:400;color:var(--amber);background:var(--amber-bg);border-radius:20px;padding:0 6px}
.csub{font-size:11px;color:var(--tx3);margin:2px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 8px}
.cmg .mi{background:#fafbfd;border-radius:6px;padding:3px 7px;border:1px solid transparent}
.cmg .mi.hl{background:var(--yellow-bg);border-color:#f0dc8a}
.cmg .mi:last-child:nth-child(odd){grid-column:1 / -1}
.cmg .mi .l{font-size:10px;color:var(--tx3);white-space:nowrap}
.cmg .mi .v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.cmg .mi.hl .v{color:var(--yellow-tx)}
.cfoot{margin-top:auto;padding-top:8px}
.cfoot a{font-size:12px}
.clink-off{font-size:12px;color:var(--tx3)}
@media (max-width:860px){
  .grid,.stats,.kpi-hero,.two-col,.charts,.metric-strip,.rt-grid,.ccards{grid-template-columns:1fr}
  .entry{flex-direction:column}
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>媒介投放项目总看板</h1>
    <p>内部资料 · 请输入访问口令</p>
    <input id="pwd" type="password" placeholder="访问口令" autofocus>
    <button id="btn">进入看板</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="data.js"></script>
<div id="app" style="display:none">
  <div class="wrap">
    <div id="view"></div>
    <div class="foot">数据来源：各项目飞书执行表（每日快照） · 项目元数据与周度进展：Q4项目管理总表（每周更新）</div>
  </div>
</div>

<script>
/* ============ 访问口令（改口令：同步更新 PASS_SHA256=sha256(新口令) 与 PASS_PLAIN） ============ */
var PASS_SHA256 = "a974c9b75aabe77bc02534618613ba7e5ba7beef59cb60300c1f20b828fd0f39"; /* moma2026 */
var PASS_PLAIN = "moma2026";
function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
function sha256(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(hex)}

/* ============ 全局错误兜底 ============ */
window.onerror = function(msg, src, line){
  var v = document.getElementById("view");
  if(v){ v.innerHTML = '<section><h2>页面渲染出错</h2><div class="textblock">'+esc(String(msg))+'（第 '+line+' 行）</div></section>'; }
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="";
};

/* ============ 工具 ============ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmtMoney(v){
  if(v==null||isNaN(v)) return "—";
  var w=v/10000;
  if(Math.abs(w)>=1) return "¥"+(Math.round(w*10)/10).toLocaleString("zh-CN")+"万";
  return "¥"+Math.round(v).toLocaleString("zh-CN");
}
function fmtNum(v){
  if(v==null||isNaN(v)) return "—";
  if(Math.abs(v)>=10000) return (v/10000).toFixed(1).replace(/\.0$/,"")+"万";
  return Math.round(v).toLocaleString("zh-CN");
}
/* 源表里的纯数字（如 338000）统一成 33.8万，避免与 "62.5万" 混排 */
function fmtRaw(s){
  if(s==null||s==="") return "—";
  var t=String(s).trim();
  if(/^[\d,]+(\.\d+)?$/.test(t)){
    var n=parseFloat(t.replace(/,/g,""));
    if(n>=10000) return fmtNum(n);
  }
  return t;
}
function barCls(p,kind){
  if(p==null) return "";
  if(kind==="spend"){ if(p>105) return "warn"; if(p>=60) return "ok"; return "low"; }
  if(p>=100) return "ok"; if(p>=60) return ""; return "low";
}
function barHtml(p,kind,full){
  if(p==null) return '<span style="color:var(--tx3);font-size:12px">—</span>';
  return '<span class="pbar'+(full?' full':'')+'"><i class="'+barCls(p,kind)+'" style="width:'+Math.min(p,100)+'%"></i></span>'
    + (full?'':'<span class="pv">'+p+'%</span>');
}
/* 详情页 hero 用的进度条：条 + 右侧百分比，不再套 .bar 造成裁切 */
function heroBar(p,kind){
  if(p==null) return '<div class="bwrap"><span style="color:var(--tx3);font-size:12px">—</span></div>';
  return '<div class="bwrap">'+barHtml(p,kind,true)+'<span class="pct">'+p+'%</span></div>';
}
function kpiOf(p,platform,keyword){
  var list=p.kpi.filter(function(k){
    var okP = !platform || k.platform===platform;
    return okP && k.metric && k.metric.indexOf(keyword)>=0;
  });
  return list.length?list[0]:null;
}
function pickMetric(p,platform,keys){
  for(var i=0;i<keys.length;i++){var k=kpiOf(p,platform,keys[i]); if(k) return k}
  return null;
}
function chujiePct(p){
  var c=p.chujie; if(!c||!c.target) return null;
  return c.progress_pct!=null?c.progress_pct:Math.round(c.actual/c.target*1000)/10;
}
/* 声量：整体优先，缺失时退回平台口径（6201 用红书阅读量） */
function voiceOf(p){
  return kpiOf(p,"整体","声量") || kpiOf(p,null,"声量") || null;
}

/* ============ 折线图（纯 SVG） ============ */
function lineChart(host, cfg){
  var w=460,h=150,padL=44,padR=10,padT=10,padB=22;
  var vals=cfg.values||[], dates=cfg.dates||[];
  if(!vals.length){host.innerHTML='<div class="empty">暂无数据</div>';return}
  var max=Math.max.apply(null,vals), min=0;
  var span=(max-min)||1;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  function X(i){return padL + (vals.length===1?innerW/2:innerW*i/(vals.length-1))}
  function Y(v){return padT + innerH*(1-(v-min)/span)}
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1)}).join(" ");
  var area="M"+X(0).toFixed(1)+","+(h-padB)+" L"+pts.split(" ").join(" L")+" L"+X(vals.length-1).toFixed(1)+","+(h-padB)+" Z";
  var grid="",ylab="";
  for(var g=0;g<=3;g++){
    var yy=padT+innerH*g/3, val=max-(span*g/3);
    grid+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#eef1f6" stroke-width="1"/>';
    ylab+='<text x="'+(padL-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#8f959e">'+fmtNum(val)+'</text>';
  }
  var xlab="", step=Math.max(1,Math.ceil(dates.length/5));
  for(var i=0;i<dates.length;i+=step){
    xlab+='<text x="'+X(i).toFixed(1)+'" y="'+(h-7)+'" text-anchor="middle" font-size="9" fill="#8f959e">'+dates[i].slice(5)+'</text>';
  }
  var dots=vals.map(function(v,i){
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.4" fill="#fff" stroke="'+cfg.color+'" stroke-width="1.3"><title>'+dates[i]+'：'+fmtNum(v)+'</title></circle>';
  }).join("");
  host.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    +grid
    +'<path d="'+area+'" fill="'+cfg.color+'" opacity="0.07"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="'+cfg.color+'" stroke-width="1.8" stroke-linejoin="round"/>'
    +dots
    +'<line x1="'+padL+'" y1="'+(h-padB)+'" x2="'+(w-padR)+'" y2="'+(h-padB)+'" stroke="#e4e8ef" stroke-width="1"/>'
    +ylab+xlab+'</svg>';
}

           metrics:[["ctr","点击率"],["irate","互动率"],["cpc","CPC"],["gmv","总GMV"],
                    ["roi","总ROI"],["deal_rate","任务商品成交率"],["visitor_cost","进店成本"]]}
};

function contentOldCount(p, plat){

/* 取某平台的出街条数/目标（只有多平台分表统计的项目才有 platforms） */
function platChujie(p, name){

  for(var i=0;i<ps.length;i++){ if(ps[i].platform===name) return ps[i] }
  return null;

function dkey(d){
  var m=/^(\d{1,4})[\/-](\d{1,2})[\/-](\d{1,2})$/.exec(d||"");
  if(m) return [+m[2],+m[3]];
  m=/(\d{1,2})月(\d{1,2})/.exec(d||"");
  if(m) return [+m[1],+m[2]];
  return [0,0];
}
function coverHtml(it, plat){
  var meta=PLAT_META[plat];
  var ov='<div class="ov"><span class="pb">'+meta.label+'</span>'
    +'<span class="nn">'+esc(it.name)+'</span>'

    return '<div class="ccover '+meta.cls+'"><img src="'+esc(it.cover)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'+ov+'</div>';
  }

/* 缺失 / 已判为失真的指标统一显示 "/" */
function mv(it, key){
  var v = (key==="irate") ? it.irate : (it.m ? it.m[key] : "");
  if(v==null) return "/";
  var t=String(v).trim();
  return (t===""||t==="—"||t==="-") ? "/" : t;
}
/* '¥1,234.5' / '12.5%' -> 1234.5 / 12.5 ；无效返回 null */
function toNum(v){
  if(v==null) return null;
  var t=String(v).replace(/[¥,\s%]/g,"");
  if(t===""||t==="/"||t==="-"||t==="—") return null;
  var n=parseFloat(t);
  return isNaN(n)?null:n;
}
/* 该平台的主排序/汇总指标：抖音看 CPA3，红书看 进店成本 */
function platKey(plat){ return plat==="douyin" ? "cpa3" : "visitor_cost" }
function posOrInf(v){ return (v==null||v<=0) ? Infinity : v }

/* 类型级加权汇总：先用基数（费用 / 播放量 / 新增A3 / 进店UV / GMV）累加，再相除
   这样得到的是「该类型整体」的 CPM / CPA3 / 进店成本 / ROI，而不是单条指标的算术平均 */
function typeAgg(arr, plat){
  var sum={cost:0, views:0, a3:0, uv:0, gmv:0};
  var sub={views:0, a3:0, uv:0, gmv:0};   // 只累加该基数有效的条目对应的费用
  arr.forEach(function(it){
    var n=it.n||{}, c=n.cost||0;
    sum.cost+=c;
    if(n.views>0){ sum.views+=n.views; sub.views+=c }
    if(n.a3>0){ sum.a3+=n.a3; sub.a3+=c }
    if(n.uv>0){ sum.uv+=n.uv; sub.uv+=c }
    if(n.gmv>0){ sum.gmv+=n.gmv; sub.gmv+=c }
  });
  return {
    cost: sum.cost,
    cpm: sum.views>0 ? sub.views/sum.views*1000 : null,
    cpa3: sum.a3>0 ? sub.a3/sum.a3 : null,
    vcost: sum.uv>0 ? sub.uv/sum.uv : null,
    roi: sub.gmv>0 ? sum.gmv/sub.gmv : null
  };
}
function fmtE(v, isMoney){
  if(v==null||!isFinite(v)||v<=0) return "/";
  return isMoney ? ("¥"+(v>=100?Math.round(v):Math.round(v*100)/100))
                 : (Math.round(v*100)/100).toFixed(2);
}

function renderContent(id){
  var D=window.DATA, v=document.getElementById("view");
  var p=D.projects.filter(function(x){return x.id===id})[0];
  if(!p){renderHome();return}

  var html='<div class="crumb"><a onclick="location.hash=\'#/p/'+p.id+'\'">‹ 返回 '+esc(p.name)+'</a></div>'

    +'<span class="dnote">内容类型与达人按 CPA3（红书按 进店成本）由低到高排序；该页面中的成本均为不去重数据，只作为内容效率对比参考值。</span></div>';

  var total=0;
  ["douyin","xhs"].forEach(function(plat){
    var items=(p.content&&p.content[plat])||[];
    if(!items.length) return;
    total+=items.length;
    var meta=PLAT_META[plat];
    var key=platKey(plat);
    var oldN=items.filter(function(i){return i.old}).length;

    html+='<div class="psection"><div class="phead">'
      +'<span class="plat-dot '+meta.cls+'">'+meta.label+'</span>'
      +'<span class="nm">'+meta.label+'</span>'
      +'<span class="ct">'+items.length+' 条'+(oldN?'（含老素材 '+oldN+' 条）':'')+'</span>'
      +'<span class="tagb">'+(plat==="xhs"?"点击率 / 互动率 / CPC / GMV / ROI / 成交率 / 进店成本":"内容费用 / 投流费用 / CPM / CPA3 / 进店CPUV / GMV / ROI")+'</span>'
      +'</div>';

    // 按内容类型分组
    var groups={}, order=[];

      var k=it.type||"未分类";
      if(!groups[k]){groups[k]=[];order.push(k)}
      groups[k].push(it);
    });

    // 类型级汇总 + 按主指标从低到高排序（无值排最后）
    var agg={};
    order.forEach(function(g){ agg[g]=typeAgg(groups[g], plat) });
    order.sort(function(a,b){
      var x=posOrInf(plat==="douyin"?agg[a].cpa3:agg[a].vcost);
      var y=posOrInf(plat==="douyin"?agg[b].cpa3:agg[b].vcost);
      if(x!==y) return x-y;
      return groups[b].length-groups[a].length;
    });

    order.forEach(function(g){
      var arr=groups[g].slice();
      // 新素材在前、老素材在后；各自按主指标从低到高，再按发布日期倒序
      arr.sort(function(x,y){
        if(x.old!==y.old) return x.old?1:-1;
        var a=posOrInf(toNum(x.m?x.m[key]:"")), b=posOrInf(toNum(y.m?y.m[key]:""));
        if(a!==b) return a-b;
        var da=dkey(x.date), db=dkey(y.date);
        if(da[0]!==db[0]) return db[0]-da[0];
        return db[1]-da[1];
      });
      var A=agg[g];
      var tm = plat==="douyin"
        ? '<span class="tmi"><b>CPM</b>'+fmtE(A.cpm,true)+'</span><span class="tmi"><b>CPA3</b>'+fmtE(A.cpa3,true)+'</span>'
        : '<span class="tmi"><b>进店成本</b>'+fmtE(A.vcost,true)+'</span><span class="tmi"><b>ROI</b>'+fmtE(A.roi,false)+'</span>';
      html+='<div class="typeg"><h4>'+esc(g)+'<span class="n">'+arr.length+'</span>'
        +'<span class="tm">'+tm+'</span></h4><div class="ccards">';
      arr.forEach(function(it){ html+=cardHtml(it,plat) });
      html+='</div></div>';
    });
    html+='</div>';
  });

  if(!total){
    html+='<section><div class="empty">本项目执行表暂无可展示的发布内容记录。</div></section>';
  }
  v.innerHTML=html;
  window.scrollTo(0,0);
}

/* 后端成本叙述：有 CPUV 用 CPUV；没有就说明缺 UV 并退回前端成本（不输出 "¥/ /" 这类空值） */
function adsBack(r){

/* 可排序表头：点击列头切换 降序/升序，空值(/)始终沉底 */
function sortTh(head){
  return '<thead><tr>'+head.map(function(h,i){
    return '<th class="s" data-i="'+i+'" onclick="sortTable(this)">'+h+'<span class="car">▼</span></th>';
  }).join('')+'</tr></thead>';
}
function _cellNum(td){
  if(!td) return null;
  var t=(td.textContent||"").replace(/[¥,\s]/g,"").replace("%","");
  if(t==="" || t==="/" || t==="—" || t==="-") return null;
  var v=parseFloat(t);
  return isNaN(v)?null:v;
}
function sortTable(th){
  var table=th.closest("table"); if(!table||!table.tBodies[0]) return;
  var idx=parseInt(th.getAttribute("data-i"),10);
  var tb=table.tBodies[0];
  var all=Array.prototype.slice.call(tb.rows);
  var fixed=all.filter(function(r){return (r.className||"").indexOf("sum")>=0});
  var rows=all.filter(function(r){return (r.className||"").indexOf("sum")<0});
  var dir = th.getAttribute("data-dir")==="desc" ? "asc" : "desc";
  Array.prototype.forEach.call(th.parentNode.children,function(h){
    h.removeAttribute("data-dir"); h.classList.remove("on");
    var c=h.querySelector(".car"); if(c) c.textContent="▼";
  });
  th.setAttribute("data-dir",dir); th.classList.add("on");
  var c=th.querySelector(".car"); if(c) c.textContent = dir==="desc" ? "▼" : "▲";
  rows.sort(function(a,b){
    var va=_cellNum(a.cells[idx]), vb=_cellNum(b.cells[idx]);
    if(va===null&&vb===null) return 0;
    if(va===null) return 1;
    if(vb===null) return -1;
    return dir==="asc" ? va-vb : vb-va;
  });
  rows.concat(fixed).forEach(function(r){tb.appendChild(r)});
}
/* 效率表格：rows 已按效率最差在前；首行标红=最需优化 */
function adsTable(head, rows, render){

  var html='<table>'+sortTh(head)+'<tbody>';
  rows.forEach(function(r,i){
    html+='<tr'+(i===0?' style="background:var(--red-bg)"':'')+'>'+render(r,i)+'</tr>';
  });
  return html+'</tbody></table>';
}
function deltaTxt(cur, prev, unit, better){
  if(cur==null&&prev==null) return "—";
  var f=function(v){return v==null?"/":v};
  var arrow="";
  if(cur!=null&&prev!=null&&prev>0){
    var diff=(cur-prev)/prev*100;
    var color = better==null ? "var(--tx2)"
      : (better==="down" ? (diff<0?"var(--green)":"var(--red)") : (diff>0?"var(--green)":"var(--red)"));
    arrow=' <span style="color:'+color+'">'+(diff>=0?'▲':'▼')+Math.abs(Math.round(diff))+'%</span>';
  }
  return f(cur)+unit+arrow;
}
function dayCmp(days, keys){
  if(!days||days.length<2) return '<span style="color:var(--tx3)">数据不足一天</span>';
  var a=days[days.length-2], b=days[days.length-1];
  return '<div style="font-size:11px;line-height:1.7">'
    +'<div style="color:var(--tx3)">'+a.date.slice(5)+' → <b>'+b.date.slice(5)+'</b></div>'
    +keys.map(function(k){
      return '<div>'+k[1]+'：'+deltaTxt(b[k[0]], a[k[0]], "", k[2])+'</div>';
    }).join('')+'</div>';
}

function round2(v){ return Math.round(v*100)/100 }

function renderAds(id){
  var D=window.DATA, v=document.getElementById("view");
  var p=D.projects.filter(function(x){return x.id===id})[0];
  if(!p){renderHome();return}
  var A=p.ads||{};
  var html='<div class="crumb"><a onclick="location.hash=\'#/p/'+p.id+'\'">‹ 返回 '+esc(p.name)+'</a></div>'
    +'<div class="dhead"><h1>投流情况 · 投流诊断</h1><div class="chips"><span class="chip">'+esc(p.short)+'</span></div></div>'
    +'<div class="dmeta"><span>数据源：'+esc([A.xhs&&A.xhs.src,A.dy&&A.dy.src].filter(Boolean).join(" ／ ")||"暂无可用投流底表")+'</span>'
    +'<span>诊断链路：版位 → 内容类型 → 定向 → 素材 → 次日对比</span></div>'
    +((A.xhs&&!A.dy)?'<div style="margin:2px 0 8px;padding:8px 12px;border-radius:8px;background:#fff8e6;border:1px solid #f4e0a8;color:#8a5a00;font-size:12px;line-height:1.65">抖音侧暂无当期素材级投流明细表（本项目 by素材看板 仅含 3-4月/618 归档数据，【26年双11】投流进度只有总消耗、无素材维度），故本页仅提供红书诊断。接入抖音投流日报后即可补上竞价 / 热推拆分。</div>':'');

  if(!A.xhs&&!A.dy){
    html+='<section><div class="empty">本项目暂无可用的投流平台数据底表。<br>接入口径：红书需聚光数据源（含版位 / 定向 / 达人 / 消费 / 展现 / 点击），抖音需投流数据源或 by素材看板。</div></section>';
    v.innerHTML=html; window.scrollTo(0,0); return;
  }
  html+='<div id="adsBody"></div>';
  html+='<div class="foot">优化动作建议：暂停 / 优化标红素材 → 次日回看「最新一天 vs 前一天」验证是否改善（数据每日 14:00 快照）。</div>';
  v.innerHTML=html;
  ADS_VIEW = {p:p, plat: A.xhs?"xhs":"dy", tool:"all", dim: A.xhs?"placements":"materials", tkind:"all"};
  // 深链支持：?plat=xhs&tool=种草&dim=targets&tkind=kw 直达筛选状态（也用于自动化校验）
  try{
    var qs=new URLSearchParams(location.search);
    var qp=qs.get("plat"), qt=qs.get("tool"), qd=qs.get("dim"), qk=qs.get("tkind");
    if(qp==="xhs"&&A.xhs) ADS_VIEW.plat="xhs";
    else if(qp==="dy"&&A.dy) ADS_VIEW.plat="dy";
    if(qd){ var okd=(ADS_VIEW.plat==="xhs")?["placements","types","targets","materials"]:["materials"]; if(okd.indexOf(qd)>=0) ADS_VIEW.dim=qd; }
    if(qt&&qt!=="all"){ var tl=(ADS_VIEW.plat==="xhs"?A.xhs.tools:A.dy.tools)||[]; if(tl.filter(function(t){return t.key===qt}).length) ADS_VIEW.tool=qt; }
    if(qk&&["all","kw","aud","none"].indexOf(qk)>=0) ADS_VIEW.tkind=qk;
  }catch(e){}
  adsPaint();
  window.scrollTo(0,0);
}

function gLocalRead(){ try{ return JSON.parse(localStorage.getItem("q4board_guide_v1")||"[]") }catch(e){ return [] } }
function gLocalWrite(a){ try{ localStorage.setItem("q4board_guide_v1", JSON.stringify(a)) }catch(e){} }
function gAdd(){
  var t=document.getElementById("gTitle").value.trim();
  var u=document.getElementById("gUrl").value.trim();
  if(!t||!u){ alert("请至少填写「文档标题」和「链接」"); return }
  var a=gLocalRead();
  a.push({proj:document.getElementById("gProj").value, t:t, u:u,
          s:document.getElementById("gSheet").value.trim(),
          use:document.getElementById("gUse").value.trim()});
  var y=window.scrollY; gLocalWrite(a); renderGuide(); window.scrollTo(0,y);
}
function gDel(pid, i){
  var a=gLocalRead(), k=-1, cnt=0;
  for(var j=0;j<a.length;j++){ if(a[j].proj===pid){ if(cnt===i){k=j;break} cnt++ } }
  if(k>=0){ var y=window.scrollY; a.splice(k,1); gLocalWrite(a); renderGuide(); window.scrollTo(0,y) }
}
function gExport(){
  var a=gLocalRead();
  if(!a.length){ alert("本机暂无补充记录"); return }
  var txt=JSON.stringify(a,null,1);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ alert("已复制 JSON，直接粘贴发给项目同学即可") },
      function(){ window.prompt("复制下面 JSON：", txt) });
  } else { window.prompt("复制下面 JSON：", txt) }
}
function gClear(){ if(confirm("清空本机所有补充记录？")){ gLocalWrite([]); renderGuide() } }

              +'<td>'+esc(r.u)+'</td><td class="gf">'+esc(r.f||"—")+'</td><td class="gfr">'+esc(r.fr||"—")+'</td></tr>';
          }).join('')
        +'</tbody></table></div>';
    });
    var loc=local.filter(function(x){return x.proj===g.id});
    if(loc.length){
      html+='<div class="gdoc glocal"><div class="gdt"><span class="gdt2">本机补充</span><span class="gdc">未写入看板</span></div>'
        +'<table class="gt"><thead><tr><th>文档 / sheet</th><th>引用用途</th><th>链接</th><th></th></tr></thead><tbody>'
        +loc.map(function(x,li){
            return '<tr><td class="gs"><span class="sname">'+esc(x.t)+'</span><span class="sid">'+esc(x.s||"")+'</span></td>'
              +'<td>'+esc(x.use||"—")+'</td>'
              +'<td><a href="'+esc(x.u)+'" target="_blank" rel="noopener">打开 ↗</a></td>'

          }).join('')

    }
    if(g.gaps&&g.gaps.length){
      html+='<div class="gapbox"><b>待补 / 说明</b><ul>'+g.gaps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
    }
    html+='</section>';
  });

  html+='<section><h2>补充数据源索引<span class="hint">本机临时登记，导出后可同步进看板</span></h2>'
   +'<div class="gform">'

   +'<label>文档标题<input id="gTitle" placeholder="如：6302 抖音投流日报"></label>'
   +'<label>文档链接<input id="gUrl" placeholder="https://...feishu.cn/wiki/..."></label>'
   +'<label>Sheet 名称 / ID<input id="gSheet" placeholder="如：投流日报 / dOBF9h"></label>'

   +'</div>'
   +'<div class="gbtns"><button class="btn primary" onclick="gAdd()">添加到本机</button>'

  html+='<div class="foot">引用口径：数值均来自上表底表的原始单元格，未做二次加工；出街数按「批次 + 发布日期」过滤，投流按「日期 ≥ 9.15」过滤。</div>';
  v.innerHTML=html;
  window.scrollTo(0,0);
}

function route(){
  var h=location.hash||"#/";
  if(h==="#/guide"){renderGuide();return}
  var m=h.match(/^#\/p\/([^\/]+)\/ads$/);
  if(m){renderAds(m[1]);return}
  m=h.match(/^#\/p\/([^\/]+)\/content$/);
  if(m){renderContent(m[1]);return}
  m=h.match(/^#\/p\/(.+)$/);
  if(m){renderDetail(m[1]);return}
  renderHome();
}
window.addEventListener("hashchange",route);

/* ============ 口令门 ============ */
var HAS_STORE = (function(){try{sessionStorage.setItem("__t","1");sessionStorage.removeItem("__t");return true}catch(e){return false}})();
function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function decData(pwd){
  var e=window.__ENC__;
  if(!e||!pwd||!(window.crypto&&crypto.subtle))return Promise.reject(new Error("no-enc-or-pwd"));
  var te=new TextEncoder();
  return crypto.subtle.importKey("raw",te.encode(pwd),"PBKDF2",false,["deriveKey"])
    .then(function(km){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(e.s),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"])})
    .then(function(k){var all=b64d(e.d);return crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},k,all.slice(12))})
    .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}
function unlock(pwd){
  window.__PWD=pwd||"";
  if(HAS_STORE){sessionStorage.setItem("q4board_ok","1");if(pwd)sessionStorage.setItem("q4board_pwd",pwd)}
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="";
  if(!window.DATA){boot().then(route).catch(function(){route()})}
  else{route()}
}
function tryUnlock(){
  var val=document.getElementById("pwd").value.trim();
  var check = (window.crypto&&crypto.subtle)?sha256(val):Promise.resolve(val===PASS_PLAIN?"match":"no");
  check.then(function(h){
    if(h===PASS_SHA256||h==="match"){unlock(val)}
    else{document.getElementById("err").textContent="口令不正确，请重试";document.getElementById("pwd").value="";document.getElementById("pwd").focus()}
  }).catch(function(){
    if(val===PASS_PLAIN){unlock(val)}else{document.getElementById("err").textContent="口令不正确，请重试"}
  });
}
document.getElementById("btn").addEventListener("click",tryUnlock);
document.getElementById("pwd").addEventListener("keydown",function(e){if(e.key==="Enter")tryUnlock()});

function boot(){
  if(window.__DATA__){window.DATA=window.__DATA__;return Promise.resolve()}
  if(window.__ENC__){
    return decData(window.__PWD).then(function(d){
      window.DATA=d;
    }).catch(function(e){
      if(HAS_STORE)sessionStorage.removeItem("q4board_ok");
      document.getElementById("gate").style.display="";
      document.getElementById("app").style.display="none";
      document.getElementById("err").textContent="数据解密失败，请重新输入口令";
      return new Promise(function(){}); /* 挂起，阻止 route() 在无数据时渲染 */
    });
  }
  return fetch("data.json?ts="+Date.now()).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){window.DATA=d}).catch(function(e){
    document.getElementById("view").innerHTML=
      '<section><h2>数据加载失败</h2><div class="textblock">未能读取数据（'+esc(String(e))+'）。</div></section>';
  });
}

if(!HAS_STORE||sessionStorage.getItem("q4board_ok")!=="1"){ /* 停在口令门 */ } else { unlock(HAS_STORE?(sessionStorage.getItem("q4board_pwd")||""):"") }
